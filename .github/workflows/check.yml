name: Verifications

# `pur`      : verifications sans GPU, micro ni ffmpeg (python tools/check_gl.py --pur) ; rapide, bloquant.
# `complet`  : toute la suite, avec un OpenGL logiciel (Mesa llvmpipe) et ffmpeg installes sur le serveur. Les tests de mise en page de la
#              fenetre connus pour etre instables (FRAGILES dans check_gl.py) font sortir le programme avec le code 3 : la suite est alors
#              relancee UNE fois ; tout autre echec, ou un echec qui revient, fait echouer le job.
# La mesure de latence logicielle est ecrite dans le resume du job (information, jamais un seuil : un serveur partage est trop variable).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  pur:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gl.txt
      - run: python -m pip install -r requirements-gl.txt
      - run: python tools/check_gl.py --pur

  complet:
    needs: pur
    runs-on: windows-latest
    timeout-minutes: 45
    # Passe a false quand le job est vert de facon stable (voir CLAUDE.md, « Integration continue »).
    continue-on-error: true
    env:
      MESA_VERSION: "26.2.4"
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: "4.6"
      MESA_GLSL_VERSION_OVERRIDE: "460"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gl.txt
      - run: python -m pip install -r requirements-gl.txt
      - name: OpenGL logiciel (Mesa llvmpipe) dans le dossier de Python
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest $url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $py = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa\x64\opengl32.dll, mesa\x64\libgallium_wgl.dll, mesa\x64\libglapi.dll $py -Force
          Get-ChildItem $py -Filter *.dll | Where-Object { $_.Name -in "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll" } | Select-Object Name, Length
      - name: ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress | Out-Null
          ffmpeg -version | Select-Object -First 1
      - name: Suite complete (relancee une fois si seuls des tests de mise en page instables echouent)
        shell: pwsh
        run: |
          python tools/check_gl.py *> check.log
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            Write-Host "Echecs de mise en page connus pour etre instables : nouvelle execution"
            Copy-Item check.log check-1.log
            python tools/check_gl.py *> check.log
            $code = $LASTEXITCODE
          }
          Get-Content check.log -Tail 60
          exit $code
      - name: Latence logicielle (information)
        if: always()
        shell: pwsh
        run: |
          "### Latence audio -> image (chaine logicielle, serveur partage : indicatif)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          python tools/mesure_latence.py --kicks 8 2>&1 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-verifications
          path: check*.log
          if-no-files-found: ignore
